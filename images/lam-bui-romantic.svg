<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" width="100%" height="100%">
  <defs>
    <!-- Skin Tone -->
    <linearGradient id="lamSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f0" />
      <stop offset="65%" stop-color="#fedacf" />
      <stop offset="100%" stop-color="#f5beae" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="lamHair" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Romantic Blush Suit / Blazer -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Inner Crisp White Shirt -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Trousers -->
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Fresh Red Rose Gradient -->
    <linearGradient id="roseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#a4161a" />
    </linearGradient>

    <!-- Rose Stem & Leaf -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Soft Warm Aura -->
    <radialGradient id="romanticAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fdf2f8" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#fce7f3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0" />
    </radialGradient>

    <!-- Ground Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2b28" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#3d2b28" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- WARM ROMANTIC AURA & GROUND SHADOW -->
  <circle cx="190" cy="240" r="170" fill="url(#romanticAura)" />
  <ellipse cx="190" cy="535" rx="100" ry="16" fill="url(#groundShadow)" />

  <!-- LEGS & STYLISH TROUSERS -->
  <g id="trousers-and-shoes">
    <!-- Left Leg -->
    <path d="M152,320 L140,480 L168,480 L178,320 Z" fill="url(#pantsGrad)" />
    <!-- Left Shoe -->
    <path d="M136,478 L130,520 Q130,528 152,528 L170,528 Q172,518 170,478 Z" fill="#0f172a" />
    <path d="M136,478 L170,478" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Right Leg (Gentle, relaxed posture) -->
    <path d="M198,320 L210,480 L238,480 L222,320 Z" fill="url(#pantsGrad)" />
    <!-- Right Shoe -->
    <path d="M208,478 L212,520 Q218,528 242,528 L258,528 Q260,518 240,478 Z" fill="#0f172a" />
    <path d="M208,478 L240,478" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- TORSO, INNER SHIRT & STYLISH ROSE-PINK BLAZER -->
  <g id="torso-and-jacket">
    <!-- Inner White Shirt -->
    <path d="M165,145 L155,325 Q190,332 225,325 L215,145 Z" fill="url(#shirtGrad)" />
    <!-- Shirt Collar (V-neck open collar) -->
    <polygon points="172,145 190,195 208,145" fill="#e2e8f0" />
    <polygon points="175,145 190,190 182,145" fill="#ffffff" />
    <polygon points="205,145 190,190 198,145" fill="#ffffff" />

    <!-- Delicate Gold Pendant Necklace -->
    <path d="M182,160 Q190,175 198,160" stroke="#f59e0b" stroke-width="1.2" fill="none" />
    <circle cx="190" cy="172" r="2.5" fill="#f59e0b" />

    <!-- Rose-Pink Tailored Blazer -->
    <!-- Left Flap -->
    <path d="M145,150 L132,325 Q165,330 185,325 L165,225 L182,180 L160,150 Z" fill="url(#blazerGrad)" stroke="#be185d" stroke-width="0.8" />
    <!-- Right Flap -->
    <path d="M235,150 L248,325 Q215,330 195,325 L215,225 L198,180 L220,150 Z" fill="url(#blazerGrad)" stroke="#be185d" stroke-width="0.8" />

    <!-- Blazer Lapels -->
    <path d="M160,150 L182,220 L165,225 L145,150 Z" fill="#f472b6" />
    <path d="M220,150 L198,220 L215,225 L235,150 Z" fill="#f472b6" />

    <!-- Pocket with white pocket square -->
    <path d="M148,225 L164,228 L163,242 L147,239 Z" fill="#be185d" />
    <polygon points="151,225 156,215 161,227" fill="#ffffff" />

    <!-- Blazer Buttons -->
    <circle cx="190" cy="245" r="3.5" fill="#ffffff" stroke="#be185d" stroke-width="1" />
    <circle cx="190" cy="275" r="3.5" fill="#ffffff" stroke="#be185d" stroke-width="1" />
  </g>

  <!-- HEAD & DASHING ANIME FACE -->
  <g id="head-and-face">
    <!-- Neck -->
    <path d="M178,125 L178,155 Q190,160 202,155 L202,125 Z" fill="url(#lamSkin)" />
    <!-- Soft shadow under chin -->
    <path d="M178,135 Q190,146 202,135" fill="#f5beae" opacity="0.6" />

    <!-- Anime Jawline -->
    <path d="M165,95 C162,125 174,148 190,154 C206,148 218,125 215,95 C215,65 165,65 165,95 Z" fill="url(#lamSkin)" />

    <!-- Warm Rosy Cheek Blushes -->
    <ellipse cx="173" cy="118" rx="8" ry="4" fill="#fb7185" opacity="0.45" />
    <ellipse cx="207" cy="118" rx="8" ry="4" fill="#fb7185" opacity="0.45" />

    <!-- Charming Tender Smile -->
    <path d="M182,126 Q190,135 198,126" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M185,128 Q190,132 195,128" stroke="#fda4af" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cute Anime Nose -->
    <path d="M189,112 L191,118" stroke="#e09583" stroke-width="1.3" stroke-linecap="round" />

    <!-- Warm Expressive Anime Eyes (Deep amber / dark chocolate) -->
    <!-- Left Eye -->
    <g transform="translate(170, 100)">
      <path d="M0,6 Q7,0 15,3" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <ellipse cx="8" cy="8" rx="5.5" ry="6.5" fill="#451a03" />
      <ellipse cx="8" cy="8" rx="4" ry="5" fill="#92400e" />
      <!-- Starry highlights -->
      <circle cx="6" cy="6" r="2.2" fill="#ffffff" />
      <circle cx="10" cy="10" r="1.2" fill="#ffffff" />
      <path d="M3,13 Q8,15 13,13" stroke="#b45309" stroke-width="1" fill="none" opacity="0.7" />
      <!-- Eyebrow -->
      <path d="M-1,-2 Q7,-6 15,-2" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Eye -->
    <g transform="translate(196, 100)">
      <path d="M0,3 Q8,0 15,6" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <ellipse cx="7" cy="8" rx="5.5" ry="6.5" fill="#451a03" />
      <ellipse cx="7" cy="8" rx="4" ry="5" fill="#92400e" />
      <circle cx="5" cy="6" r="2.2" fill="#ffffff" />
      <circle cx="9" cy="10" r="1.2" fill="#ffffff" />
      <path d="M2,13 Q7,15 12,13" stroke="#b45309" stroke-width="1" fill="none" opacity="0.7" />
      <!-- Eyebrow -->
      <path d="M0,-2 Q8,-6 16,-2" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Ears -->
    <path d="M165,102 C160,107 160,119 165,123 Z" fill="#fedacf" />
    <path d="M215,102 C220,107 220,119 215,123 Z" fill="#fedacf" />

    <!-- Dashing Modern Anime Hair (Side-part, textured fringe) -->
    <path d="M160,95 C150,55 230,50 220,95 C230,75 220,58 190,58 C160,58 150,75 160,95 Z" fill="url(#lamHair)" />
    <!-- Front bangs gracefully parted -->
    <path d="M162,88 C170,106 178,110 182,100 C186,114 196,112 200,98 C204,110 214,106 218,92 C210,75 170,75 162,88 Z" fill="url(#lamHair)" />
    <path d="M188,70 Q194,105 190,112" stroke="#475569" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Silky Hair Gloss Highlight -->
    <path d="M172,66 Q190,60 210,66" stroke="#94a3b8" stroke-width="2.6" fill="none" opacity="0.65" stroke-linecap="round" />
  </g>

  <!-- LEFT ARM (Hand gently placed over heart / chest) -->
  <g id="left-arm">
    <path d="M145,160 L115,225 Q110,245 125,258 L142,242 L132,225 L152,175 Z" fill="url(#blazerGrad)" stroke="#be185d" stroke-width="0.7" />
    <!-- Hand over heart -->
    <path d="M125,245 C122,252 130,260 138,258 C144,255 145,248 140,242 Z" fill="#fedacf" />
    <!-- Fingers curled softly -->
    <path d="M130,248 Q135,246 140,250" stroke="#f5beae" stroke-width="1.2" fill="none" />
  </g>

  <!-- RIGHT ARM EXTENDED (Presenting a blooming rose) -->
  <g id="right-arm-presenting-rose">
    <path d="M232,160 L278,205 Q295,215 315,210 L318,192 Q295,190 250,155 Z" fill="url(#blazerGrad)" stroke="#be185d" stroke-width="0.7" />
    <!-- Hand gently offering the flower stem -->
    <ellipse cx="316" cy="204" rx="9" ry="11" fill="url(#lamSkin)" transform="rotate(-15 316 204)" />
    <!-- Delicate fingers -->
    <path d="M312,198 Q322,194 326,202 Q320,208 314,204 Z" fill="#fedacf" />
    <path d="M314,204 Q324,202 328,210 Q322,215 316,211 Z" fill="#fedacf" />

    <!-- THE OFFERED BLOOMING ROSE -->
    <!-- Green stem -->
    <path d="M305,235 Q320,205 330,175" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Leaves -->
    <path d="M312,222 Q300,218 305,210 Q315,214 314,222 Z" fill="url(#leafGrad)" />
    <path d="M322,195 Q335,192 332,184 Q322,187 322,195 Z" fill="url(#leafGrad)" />

    <!-- Blooming Rose Blossom -->
    <g transform="translate(330, 165)">
      <!-- Petals Glow -->
      <circle cx="0" cy="0" r="24" fill="#ffe4e6" opacity="0.6" />
      <!-- Outer Petals -->
      <circle cx="0" cy="0" r="18" fill="url(#roseRed)" />
      <circle cx="0" cy="0" r="14" fill="#e11d48" />
      <circle cx="0" cy="0" r="9" fill="#f43f5e" />
      <!-- Swirl Inner Petals -->
      <path d="M-6,-4 Q0,-11 6,-4 Q8,3 0,7 Q-8,3 -6,-4 Z" fill="#fda4af" />
      <circle cx="0" cy="0" r="3.2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Sparkles around the Rose -->
    <g transform="translate(330, 165)">
      <polygon points="18,-18 20,-12 26,-10 20,-8 18,-2 16,-8 10,-10 16,-12" fill="#f59e0b" />
      <polygon points="-16,-20 -14,-16 -10,-14 -14,-12 -16,-8 -18,-12 -22,-14 -18,-16" fill="#f43f5e" />
      <polygon points="22,12 24,16 28,18 24,20 22,24 20,20 16,18 20,16" fill="#fb7185" />
    </g>
  </g>
</svg>
