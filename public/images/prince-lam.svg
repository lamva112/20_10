<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 540" width="100%" height="100%">
  <defs>
    <linearGradient id="princeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2eb" />
      <stop offset="70%" stop-color="#fedacf" />
      <stop offset="100%" stop-color="#f5beae" />
    </linearGradient>

    <linearGradient id="princeHair" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2c3440" />
      <stop offset="50%" stop-color="#1e252f" />
      <stop offset="100%" stop-color="#0f141a" />
    </linearGradient>

    <linearGradient id="royalCape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c92a42" />
      <stop offset="60%" stop-color="#9b182d" />
      <stop offset="100%" stop-color="#720d1e" />
    </linearGradient>

    <linearGradient id="royalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f0f4f8" />
      <stop offset="100%" stop-color="#d4e0ea" />
    </linearGradient>

    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#fff176" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>

    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c7f3ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="swordGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- HEROIC AURA GLOW -->
  <circle cx="190" cy="250" r="170" fill="url(#auraGlow)" />

  <!-- FLOWING ROYAL CAPE (Back layer) -->
  <g id="cape-back">
    <path d="M140,165 C80,240 40,360 30,460 C70,440 120,410 160,390 Z" fill="url(#royalCape)" />
    <path d="M220,165 C280,230 330,340 350,450 C310,430 250,400 210,380 Z" fill="url(#royalCape)" />
    <!-- Gold Cape Lining Trim -->
    <path d="M30,460 Q90,420 160,390" stroke="url(#goldTrim)" stroke-width="4" fill="none" />
    <path d="M350,450 Q280,415 210,380" stroke="url(#goldTrim)" stroke-width="4" fill="none" />
  </g>

  <!-- LEGS & HEROIC BOOTS -->
  <g id="legs">
    <!-- Left Leg (Pants) -->
    <path d="M150,330 L135,440 L165,440 L175,330 Z" fill="#1e293b" />
    <!-- Left Royal Boot -->
    <path d="M132,435 L125,505 Q125,518 145,518 L165,518 Q168,505 168,435 Z" fill="#0f172a" />
    <rect x="130" y="435" width="38" height="6" fill="url(#goldTrim)" rx="2" />
    <!-- Right Leg (Dynamic step forward) -->
    <path d="M195,330 L210,435 L240,435 L220,330 Z" fill="#1e293b" />
    <!-- Right Boot -->
    <path d="M208,430 L215,505 Q220,518 250,518 L265,518 Q265,505 245,430 Z" fill="#0f172a" />
    <rect x="210" y="430" width="38" height="6" fill="url(#goldTrim)" rx="2" />
  </g>

  <!-- TORSO / ROYAL PRINCE JACKET & ARMOR -->
  <g id="torso">
    <!-- White Royal Double-Breasted Coat -->
    <path d="M142,160 L130,335 Q185,345 238,335 L228,160 Q185,170 142,160 Z" fill="url(#royalArmor)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Royal Blue Sash across chest -->
    <path d="M145,170 L235,325 L215,335 L135,185 Z" fill="#2563eb" opacity="0.92" />
    <path d="M145,170 L235,325" stroke="url(#goldTrim)" stroke-width="2" />
    <path d="M135,185 L215,335" stroke="url(#goldTrim)" stroke-width="2" />

    <!-- Gold Double Buttons -->
    <g fill="url(#goldTrim)">
      <circle cx="168" cy="210" r="4.5" />
      <circle cx="202" cy="210" r="4.5" />
      <circle cx="168" cy="245" r="4.5" />
      <circle cx="202" cy="245" r="4.5" />
      <circle cx="170" cy="280" r="4.5" />
      <circle cx="200" cy="280" r="4.5" />
    </g>

    <!-- Golden Belt & Crest Buckle -->
    <rect x="135" y="318" width="100" height="14" fill="#0f172a" />
    <rect x="170" y="314" width="30" height="22" rx="4" fill="url(#goldTrim)" />
    <circle cx="185" cy="325" r="5" fill="#c92a42" />

    <!-- Golden Epaulettes (Shoulders) -->
    <!-- Left Epaulette -->
    <ellipse cx="138" cy="165" rx="18" ry="9" fill="url(#goldTrim)" transform="rotate(-20 138 165)" />
    <path d="M125,170 L120,185 M132,172 L128,188 M140,172 L138,190 M148,170 L148,188" stroke="url(#goldTrim)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Epaulette -->
    <ellipse cx="232" cy="165" rx="18" ry="9" fill="url(#goldTrim)" transform="rotate(20 232 165)" />
    <path d="M222,170 L222,188 M230,172 L232,190 M238,172 L242,188 M245,170 L250,185" stroke="url(#goldTrim)" stroke-width="2.5" stroke-linecap="round" />

    <!-- High Collar -->
    <path d="M165,135 L160,165 Q185,172 210,165 L205,135 Q185,142 165,135 Z" fill="#0f172a" />
    <path d="M165,135 Q185,142 205,135" stroke="url(#goldTrim)" stroke-width="2" fill="none" />
  </g>

  <!-- HEAD & HANDSOME ANIME FACE -->
  <g id="head">
    <!-- Neck -->
    <path d="M172,130 L172,150 Q185,155 198,150 L198,130 Z" fill="url(#princeSkin)" />

    <!-- Jawline & Face -->
    <path d="M158,100 C155,128 168,150 185,156 C202,150 215,128 212,100 C212,70 158,70 158,100 Z" fill="url(#princeSkin)" />

    <!-- Cheerful gentle cheek blush -->
    <ellipse cx="167" cy="122" rx="7" ry="3.5" fill="#f87171" opacity="0.4" />
    <ellipse cx="203" cy="122" rx="7" ry="3.5" fill="#f87171" opacity="0.4" />

    <!-- Charming Smile -->
    <path d="M178,130 Q185,138 193,130" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Anime Nose -->
    <path d="M184,116 L186,122" stroke="#e09583" stroke-width="1.3" stroke-linecap="round" />

    <!-- Confident anime eyes -->
    <!-- Left Eye -->
    <g transform="translate(163, 104)">
      <path d="M0,6 Q7,0 15,3" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <ellipse cx="8" cy="8" rx="5" ry="6" fill="#1e3a8a" />
      <ellipse cx="8" cy="8" rx="3.5" ry="4.5" fill="#0284c7" />
      <circle cx="6" cy="6" r="2" fill="#ffffff" />
      <circle cx="10" cy="10" r="1.2" fill="#ffffff" />
      <!-- Eyebrow -->
      <path d="M-1,-2 Q7,-6 15,-2" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Eye -->
    <g transform="translate(192, 104)">
      <path d="M0,3 Q8,0 15,6" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <ellipse cx="7" cy="8" rx="5" ry="6" fill="#1e3a8a" />
      <ellipse cx="7" cy="8" rx="3.5" ry="4.5" fill="#0284c7" />
      <circle cx="5" cy="6" r="2" fill="#ffffff" />
      <circle cx="9" cy="10" r="1.2" fill="#ffffff" />
      <!-- Eyebrow -->
      <path d="M0,-2 Q8,-6 16,-2" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Ears -->
    <path d="M158,105 C153,110 153,122 158,126 Z" fill="#fedacf" />
    <path d="M212,105 C217,110 217,122 212,126 Z" fill="#fedacf" />

    <!-- Stylish Anime Hair (Dashing, layered locks) -->
    <path d="M152,100 C145,60 225,55 218,100 C228,80 215,65 185,65 C155,65 142,80 152,100 Z" fill="url(#princeHair)" />
    <!-- Front bangs framing the face -->
    <path d="M155,90 C162,110 170,115 174,105 C178,118 188,118 192,105 C196,116 208,112 212,95 C205,80 165,80 155,90 Z" fill="url(#princeHair)" />
    <path d="M182,75 Q188,110 185,116" stroke="#475569" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Hair Shimmer / Highlight -->
    <path d="M165,72 Q185,66 205,72" stroke="#94a3b8" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />

    <!-- Petite Royal Crown / Tiara -->
    <g transform="translate(172, 54)">
      <polygon points="0,15 5,0 13,10 21,0 26,15" fill="url(#goldTrim)" stroke="#b45309" stroke-width="0.8" />
      <circle cx="5" cy="0" r="2" fill="#ef4444" />
      <circle cx="13" cy="10" r="2.5" fill="#38bdf8" />
      <circle cx="21" cy="0" r="2" fill="#ef4444" />
    </g>
  </g>

  <!-- LEFT ARM (Poised heroically on waist / holding cape) -->
  <g id="left-arm">
    <path d="M136,175 L105,230 Q100,250 115,265 L135,250 L125,230 L145,185 Z" fill="url(#royalArmor)" />
    <!-- Glove -->
    <path d="M115,250 L125,268 L140,258 L130,245 Z" fill="#0f172a" />
  </g>

  <!-- RIGHT ARM & LEGENDARY GLOWING SWORD -->
  <g id="right-arm-and-sword">
    <!-- Arm raised forward pointing sword -->
    <path d="M234,175 L285,185 Q305,190 320,185 L320,165 Q295,160 248,165 Z" fill="url(#royalArmor)" />
    <!-- Gauntlet/Glove -->
    <ellipse cx="320" cy="175" rx="10" ry="12" fill="#0f172a" />

    <!-- GLOWING SWORD -->
    <!-- Blade Glow effect -->
    <line x1="322" y1="175" x2="375" y2="35" stroke="url(#swordGlow)" stroke-width="26" stroke-linecap="round" />
    <!-- Golden Hilt & Crossguard -->
    <rect x="312" y="165" width="20" height="6" rx="2" fill="url(#goldTrim)" transform="rotate(-65 322 168)" />
    <circle cx="316" cy="182" r="5" fill="url(#goldTrim)" />
    <!-- Sharp Gleaming Blade -->
    <polygon points="320,168 375,32 378,35 326,172" fill="url(#swordBlade)" />
    <line x1="322" y1="170" x2="376" y2="33" stroke="#ffffff" stroke-width="2.5" />

    <!-- Sparkle Stars at Tip -->
    <g transform="translate(376, 33)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ffffff" />
      <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" fill="#38bdf8" />
    </g>
  </g>
</svg>
